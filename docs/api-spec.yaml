openapi: 3.0.3
info:
  title: EuroDroneHub API
  version: 1.0.0
  description: |
    Dronų katalogo REST API. Hierarchija: Kategorija -> Dronas -> Atsiliepimas.
    Rolės: svečias (be žetono), narys (member), administratorius (admin).
servers:
  - url: http://localhost:3000/api
    description: Lokalus serveris
tags:
  - name: Auth
  - name: Categories
  - name: Drones
  - name: Reviews

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Naujo nario registracija
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            example: { username: petras, password: petras123 }
      responses:
        '201': { description: Sukurtas naudotojas ir išduoti žetonai, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Naudotojas jau egzistuoja, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Prisijungimas
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            example: { username: admin, password: admin123 }
      responses:
        '200':
          description: Išduoti access ir refresh žetonai
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: 3f9a1c...e7
                user: { id: 1, username: admin, role: admin }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Žetonų atnaujinimas (refresh token rotacija)
      description: Senas refresh žetonas atšaukiamas, grąžinama nauja pora. Pakartotinai panaudojus seną žetoną atšaukiami visi naudotojo žetonai.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } }
      responses:
        '200': { description: Nauja žetonų pora, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Atsijungimas (refresh žetono atšaukimas)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { refreshToken: { type: string } } }
      responses:
        '204': { description: Atsijungta }

  /categories:
    get:
      tags: [Categories]
      summary: Kategorijų sąrašas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
              example:
                - { id: 1, name: FPV dronai, description: 'Greiti, manevringi dronai lenktynėms.', created_at: '2025-11-16 10:00:00', drone_count: 2 }
    post:
      tags: [Categories]
      summary: Sukurti kategoriją (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
            example: { name: Mokomieji dronai, description: Pigūs dronai pradedantiesiems. }
      responses:
        '201': { description: Sukurta, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /categories/{categoryId}:
    parameters: [{ $ref: '#/components/parameters/categoryId' }]
    get:
      tags: [Categories]
      summary: Gauti kategoriją
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categories]
      summary: Atnaujinti kategoriją (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
            example: { name: Mokomieji mini dronai }
      responses:
        '200': { description: Atnaujinta, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Categories]
      summary: Ištrinti kategoriją kartu su jos dronais (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Ištrinta }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories/{categoryId}/drones:
    parameters: [{ $ref: '#/components/parameters/categoryId' }]
    get:
      tags: [Drones]
      summary: Visi konkrečios kategorijos dronai (hierarchinis metodas)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Drone' } }
              example:
                - { id: 1, category_id: 1, name: Avata 2, manufacturer: DJI, price: 999, flight_time: 23, weight: 377, image_url: /img/fpv-1.svg, avg_rating: 4.5, review_count: 2 }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Drones]
      summary: Sukurti droną kategorijoje (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DroneInput' }
            example: { name: Tello, manufacturer: Ryze, price: 99, flight_time: 13, weight: 80 }
      responses:
        '201': { description: Sukurta, content: { application/json: { schema: { $ref: '#/components/schemas/Drone' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /categories/{categoryId}/drones/{droneId}:
    parameters: [{ $ref: '#/components/parameters/categoryId' }, { $ref: '#/components/parameters/droneId' }]
    get:
      tags: [Drones]
      summary: Gauti droną
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Drone' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Drones]
      summary: Atnaujinti droną (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DroneInput' }
            example: { price: 89.99 }
      responses:
        '200': { description: Atnaujinta, content: { application/json: { schema: { $ref: '#/components/schemas/Drone' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Drones]
      summary: Ištrinti droną (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Ištrinta }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /categories/{categoryId}/drones/{droneId}/reviews:
    parameters: [{ $ref: '#/components/parameters/categoryId' }, { $ref: '#/components/parameters/droneId' }]
    get:
      tags: [Reviews]
      summary: Drono atsiliepimų sąrašas
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Review' } }
              example:
                - { id: 2, drone_id: 1, user_id: 3, rating: 4, comment: Smagu skraidyti., recommended: true, flown_at: '2025-07-03', username: ruta }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reviews]
      summary: Parašyti atsiliepimą (member, admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
            example: { rating: 4, comment: Puikus dronas mokytis., recommended: true, flown_at: '2025-10-01' }
      responses:
        '201': { description: Sukurta, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /categories/{categoryId}/drones/{droneId}/reviews/{reviewId}:
    parameters: [{ $ref: '#/components/parameters/categoryId' }, { $ref: '#/components/parameters/droneId' }, { $ref: '#/components/parameters/reviewId' }]
    get:
      tags: [Reviews]
      summary: Gauti atsiliepimą
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Reviews]
      summary: Atnaujinti atsiliepimą (autorius arba admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
            example: { rating: 5 }
      responses:
        '200': { description: Atnaujinta, content: { application/json: { schema: { $ref: '#/components/schemas/Review' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Reviews]
      summary: Ištrinti atsiliepimą (autorius arba admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Ištrinta }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    categoryId: { name: categoryId, in: path, required: true, schema: { type: integer }, example: 1 }
    droneId: { name: droneId, in: path, required: true, schema: { type: integer }, example: 1 }
    reviewId: { name: reviewId, in: path, required: true, schema: { type: integer }, example: 1 }
  responses:
    BadRequest: { description: Neteisingas JSON arba tuščias užklausos turinys, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: Neteisingas JSON formatas } } } }
    Unauthorized: { description: Nėra arba netinkamas žetonas, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: Reikia prisijungti } } } }
    Forbidden: { description: Neturite teisių, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: Neturite teisių } } } }
    NotFound: { description: Resursas nerastas, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: Kategorija nerasta } } } }
    Unprocessable: { description: Validacijos klaida, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: Validacijos klaida, details: [rating per didelis (max 5)] } } } }
  schemas:
    Error:
      type: object
      properties: { error: { type: string }, details: { type: array, items: { type: string } } }
    Credentials:
      type: object
      required: [username, password]
      properties: { username: { type: string, minLength: 3, maxLength: 30 }, password: { type: string, minLength: 6 } }
    Tokens:
      type: object
      properties:
        accessToken: { type: string, description: 'JWT (15 min), payload: sub, username, role' }
        refreshToken: { type: string, description: 'Galioja 7 dienas, vienkartinis' }
        user: { type: object, properties: { id: { type: integer }, username: { type: string }, role: { type: string, enum: [member, admin] } } }
    CategoryInput:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 2, maxLength: 100 }, description: { type: string, maxLength: 1000 } }
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          properties: { id: { type: integer }, created_at: { type: string }, drone_count: { type: integer } }
    DroneInput:
      type: object
      required: [name, manufacturer, price]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        manufacturer: { type: string, minLength: 2, maxLength: 100 }
        price: { type: number, minimum: 0 }
        flight_time: { type: integer, minimum: 0, description: minutės }
        weight: { type: integer, minimum: 0, description: gramai }
        image_url: { type: string }
    Drone:
      allOf:
        - $ref: '#/components/schemas/DroneInput'
        - type: object
          properties: { id: { type: integer }, category_id: { type: integer }, created_at: { type: string }, avg_rating: { type: number, nullable: true }, review_count: { type: integer } }
    ReviewInput:
      type: object
      required: [rating, comment]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, minLength: 3, maxLength: 2000 }
        recommended: { type: boolean }
        flown_at: { type: string, format: date }
    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewInput'
        - type: object
          properties: { id: { type: integer }, drone_id: { type: integer }, user_id: { type: integer }, username: { type: string }, created_at: { type: string } }
